<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>Darttränaren – logiktester</title>
<style>body{font:15px system-ui;background:#111;color:#eee;padding:16px}.ok{color:#5c5}.fel{color:#f66;font-weight:700}</style></head>
<body><h1>Logiktester</h1><pre id="ut"></pre>
<script type="module">
import * as S from '../spel.js?v=0.4.0';
const ut = document.getElementById('ut'); let fel = 0, ok = 0;
const kolla = (namn, villkor, extra = '') => { villkor ? ok++ : fel++; ut.innerHTML += `<span class="${villkor ? 'ok' : 'fel'}">${villkor ? 'OK ' : 'FEL'}</span> ${namn} ${extra}\n`; };
const lika = (namn, a, b) => kolla(namn, JSON.stringify(a) === JSON.stringify(b), `→ ${JSON.stringify(a)}${JSON.stringify(a) === JSON.stringify(b) ? '' : ` (väntat ${JSON.stringify(b)})`}`);

// X01
lika('besök 60 från 501', S.besok(501, 60), { kvar: 441, bust: false, ut: false });
lika('bust under noll', S.besok(40, 60), { kvar: 40, bust: true, ut: false });
lika('bust på 1 kvar', S.besok(41, 40), { kvar: 41, bust: true, ut: false });
lika('utgång', S.besok(41, 41), { kvar: 0, bust: false, ut: true });
kolla('179 går inte', !!S.besok(501, 179).fel);
kolla('169 går inte att gå ut på', !!S.besok(169, 169).fel);
kolla('170 går att gå ut på', S.besok(170, 170).ut);
lika('utgång 170', S.utgang(170), ['T20', 'T20', 'D25']);
lika('utgång 100', S.utgang(100), ['T20', 'D20']);
lika('utgång 60', S.utgang(60), ['S20', 'D20']);
lika('utgång 40', S.utgang(40), ['D20']);
lika('utgång 41 med 1 pil', S.utgang(41, 1), null);
kolla('utgång 41 med 2 pilar', S.utgang(41, 2)?.length === 2, JSON.stringify(S.utgang(41, 2)));
lika('utgång 159', S.utgang(159), null);
kolla('alla utgångar 2–170 utom 7 omöjliga', Array.from({ length: 169 }, (_, i) => i + 2).filter((n) => !S.utgang(n)).join() === '159,162,163,165,166,168,169');
kolla('fråga dubbel nära utgång', S.fragaDubbel(60, S.besok(60, 20)) && !S.fragaDubbel(301, S.besok(301, 60)) && !S.fragaDubbel(100, S.besok(100, 40)) && S.fragaDubbel(100, S.besok(100, 60)));
lika('snitt', S.x01Snitt([{ poang: 60, pilar: 3 }, { poang: 41, pilar: 2 }]), 60.6);

// Övningar
lika('Bob27-plan', [S.plan('bobs27').length, S.plan('bobs27')[20]], [21, ['D25', 'D25', 'D25']]);
const jdc = S.plan('jdc');
lika('JDC-plan', [jdc.length, jdc.flat().length, jdc[6], jdc[12]], [19, 57, ['D1', 'D2', 'D3'], ['D19', 'D20', 'D25']]);
lika('100 pilar-plan', [S.plan('scoring', { mal: '20', pilar: 100 }).length, S.plan('scoring', { mal: '20', pilar: 100 }).at(-1)], [34, ['20']]);
const pilar = (lista) => lista.map((r, i) => r.map(([mal, segment], nr) => ({ runda: i + 1, nr: nr + 1, mal, segment }))).flat();
lika("Bob's 27", S.ovningSumma('bobs27', pilar([[['D1', 'D1'], ['D1', 'M'], ['D1', 'M']], [['D2', 'M'], ['D2', 'M'], ['D2', 'M']]])), { poang: 25, traffar: 1, pilar: 6, marks: 2 });
// JDC 1 från My Dart Training-backupen gav 427 poäng
const jdc1 = '1.1.10.S10 1.2.10.M 1.3.10.M 2.1.11.M 2.2.11.M 2.3.11.M 3.1.12.D12 3.2.12.M 3.3.12.M 4.1.13.M 4.2.13.M 4.3.13.M 5.1.14.S14 5.2.14.T14 5.3.14.M 6.1.15.S15 6.2.15.T15 6.3.15.M 7.1.D1.D1 7.2.D2.M 7.3.D3.M 8.1.D4.M 8.2.D5.M 8.3.D6.M 9.1.D7.M 9.2.D8.M 9.3.D9.M 10.1.D10.M 10.2.D11.M 10.3.D12.M 11.1.D13.M 11.2.D14.D14 11.3.D15.M 12.1.D16.M 12.2.D17.M 12.3.D18.M 13.1.D19.M 13.2.D20.M 13.3.D25.M 14.1.15.T15 14.2.15.M 14.3.15.M 15.1.16.M 15.2.16.M 15.3.16.M 16.1.17.S17 16.2.17.S17 16.3.17.M 17.1.18.S18 17.2.18.M 17.3.18.M 18.1.19.M 18.2.19.M 18.3.19.M 19.1.20.S20 19.2.20.T20 19.3.20.M'
  .split(' ').map((t) => { const [runda, nr, mal, segment] = t.split('.'); return { runda: +runda, nr: +nr, mal, segment }; });
lika('JDC som My Dart Training (427)', S.ovningSumma('jdc', jdc1).poang, 427);
lika('JDC shanghai', S.rundPoang('jdc', '20', ['S20', 'D20', 'T20']), 220);
lika('Scoring på bull', S.ovningSumma('scoring', pilar([[['25', 'S25'], ['25', 'D25'], ['25', 'M']]])).poang, 75);
lika('knappar dubbel', S.knappar('D8').map((k) => k.seg), ['D8', 'M']);
lika('knappar bull', S.knappar('25').map((k) => k.seg), ['S25', 'D25', 'M']);

// Cricket
const c = S.cricketLage([1, 2], [
  { spelare_id: 1, segment: 'T20' }, { spelare_id: 1, segment: 'T20' }, { spelare_id: 1, segment: 'S5' },
  { spelare_id: 2, segment: 'D19' }, { spelare_id: 2, segment: 'M' }, { spelare_id: 2, segment: 'S20' },
]);
lika('cricket marks och poäng', [c.lage.get(1).marks[20], c.lage.get(1).poang, c.lage.get(2).marks[19], c.lage.get(1).allaMarks], [3, 60, 2, 6]);
const solo = S.cricketLage([1], ['T20', 'T19', 'T18', 'T17', 'T16', 'T15', 'D25', 'S25'].map((segment) => ({ spelare_id: 1, segment })));
lika('solo cricket stängd', [solo.vinnare, solo.lage.get(1).allaMarks, solo.lage.get(1).poang], [1, 21, 0]);
const ej = S.cricketLage([1, 2], ['T20', 'T19', 'T18', 'T17', 'T16', 'T15', 'D25', 'S25'].map((segment) => ({ spelare_id: 1, segment })));
lika('stängt med flest poäng vinner', ej.vinnare, 1);

ut.innerHTML += `\n<b class="${fel ? 'fel' : 'ok'}">fel: ${fel}</b> (${ok} OK)\n`;
document.title = `fel: ${fel}`;
</script></body></html>
