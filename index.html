<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1512">
  <title>Darttränaren</title>
  <link rel="icon" href="ikon.svg?v=0.9.1" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dart">
  <link rel="stylesheet" href="style.css?v=0.9.1">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Till start">
      <img src="ikon.svg?v=0.9.1" alt="" class="logo" aria-hidden="true"><span>Dart</span>
    </a>
    <nav class="tabs" aria-label="Huvudmeny">
      <a href="#/" data-route="hem">Hem</a>
      <a href="#/turneringar" data-route="turneringar">Turneringar</a>
      <a href="#/historik" data-route="historik">Historik</a>
      <a href="#/statistik" data-route="statistik">Statistik</a>
      <a href="#/jag" data-route="jag" class="tab-ikon" id="minsida" aria-label="Min sida" title="Min sida"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></a>
      <a href="#/nyheter" data-route="nyheter" class="tab-ikon" id="info" aria-label="Nytt i appen" title="Nytt i appen"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.01"/></svg></a>
    </nav>
  </header>

  <main id="app" aria-live="polite">
    <p class="muted center">Laddar …</p>
  </main>

  <footer class="foot">
    <span id="kostatus"></span>
    <button type="button" class="btn installera" id="installera" hidden>Installera som app</button>
    <span id="inloggad"></span><span id="version">v0.9.1</span> · <a href="#/loggaut" id="loggaut" hidden>Logga ut</a>
  </footer>

  <script type="module" src="app.js?v=0.9.1"></script>
  <script>
    if ('serviceWorker' in navigator && !location.pathname.includes('/tests/')) navigator.serviceWorker.register('sw.js').catch(() => {});
    // Knapp för att installera appen (Chrome, Edge, Android). Visas bara när webbläsaren erbjuder installation.
    let installation = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); installation = e; document.getElementById('installera').hidden = false;
    });
    document.getElementById('installera').addEventListener('click', async () => {
      if (!installation) return;
      installation.prompt(); await installation.userChoice; installation = null;
      document.getElementById('installera').hidden = true;
    });
    window.addEventListener('appinstalled', () => { document.getElementById('installera').hidden = true; });
  </script>
</body>
</html>
